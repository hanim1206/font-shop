# Docker 없이 Cloud Build 에서 이미지를 만든다. NEXT_PUBLIC_ 값은 공개값이라 --substitutions 로 넘긴다.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_PUBLISHABLE_KEY}
      - --build-arg=NEXT_PUBLIC_TOSS_CLIENT_KEY=${_TOSS_CLIENT_KEY}
      - --build-arg=NEXT_PUBLIC_SELLER_EMAIL=${_SELLER_EMAIL}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: asia-northeast3-docker.pkg.dev/${PROJECT_ID}/font-shop/web:latest
  _SUPABASE_URL: ""
  _SUPABASE_PUBLISHABLE_KEY: ""
  _TOSS_CLIENT_KEY: ""
  _SELLER_EMAIL: ""
options:
  dynamicSubstitutions: true
